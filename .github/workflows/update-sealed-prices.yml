name: Update Sealed Prices

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-sealed-prices:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Update sealed prices
        uses: ./.github/actions/update-sealed-prices
        env:
          TCG_API: ${{ secrets.TCG_API }}

      - name: Create update branch
        run: |
          git checkout -b automation/update-sealed-prices

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/sealed_prices.json

          git diff --cached --quiet || git commit -m "Update sealed prices"

      - name: Push update branch
        run: |
          git push origin automation/update-sealed-prices

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base develop \
            --head automation/update-sealed-prices \
            --title "Update sealed prices" \
            --body "Automated update of MTG sealed product prices."