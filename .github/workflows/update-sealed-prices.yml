name: Update Sealed Prices

on:
  workflow_dispatch:

jobs:
  update-sealed-prices:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID_STAGING }}
          private-key: ${{ secrets.APP_STAGING_PRIVATE_KEY }}

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Create automation branch
        run: |
          git checkout -b automation/update-sealed-prices

      - name: Update sealed prices
        uses: ./.github/actions/update-sealed-prices
        env:
          TCG_API: ${{ secrets.TCG_API }}

      - name: Check for price changes
        id: changes
        run: |
          if git diff --quiet -- backend/data/sealed_prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No price changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Price changes detected."
          fi

      - name: Commit updated prices
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/sealed_prices.json
          git commit -m "Update sealed prices"

      - name: Push automation branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin automation/update-sealed-prices
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_URL=$(gh pr create \
            --base develop \
            --head automation/update-sealed-prices \
            --title "Update sealed prices" \
            --body "Automated update of MTG sealed product prices.")

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Merge pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.create-pr.outputs.url }}" \
            --squash \
            --delete-branch