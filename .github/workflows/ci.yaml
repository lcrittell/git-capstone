name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/sets.html
          test -f frontend/about.html
          test -d frontend/css
          test -d frontend/js