name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/sets.html
          test -f frontend/about.html
          test -d frontend/css
          test -f frontend/pack-prices.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests
  
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
      TF_VAR_render_api_token: ${{ secrets.RENDER_API_TOKEN }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        shell: pwsh
        run: |
          terraform plan -detailed-exitcode
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            Write-Host "Terraform plan completed with no changes."
            exit 0
          }

          if ($exitCode -eq 2) {
            Write-Error "Terraform detected infrastructure changes."
            exit 1
          }

          Write-Error "Terraform plan failed with exit code $exitCode."
          exit $exitCode